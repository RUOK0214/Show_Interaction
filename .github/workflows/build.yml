name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, verify and prepare files (no publishing)
        run: bash ./gradlew prepareDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: show-interaction
          path: |
            build/libs/show-interaction-*.jar
            build/distributions/show-interaction-*-distribution.zip
            build/distributions/show-interaction-*-distribution.zip.sha256
