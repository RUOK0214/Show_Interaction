plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'com.terraformersmc' }
    }
}
loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            runDir providers.gradleProperty('gameRunDir').getOrElse('run')
        }
    }
    mods {
        'show_interaction' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    // Optional development profile only; Mod Menu is never bundled or required by the mod.
    if (providers.gradleProperty('withModMenu').isPresent()) {
        clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
sourceSets {
    modelTest {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
tasks.register('modelTest', JavaExec) {
    dependsOn modelTestClasses
    classpath = sourceSets.modelTest.runtimeClasspath
    mainClass = 'io.github.ruok0214.showinteraction.HighlightHistoryTest'
    enableAssertions = true
}
check.dependsOn modelTest

apply from: 'gradle/distribution.gradle'
